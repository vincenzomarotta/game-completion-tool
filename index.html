<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Completion Tool</title>
<meta name="description" content="Carica il salvataggio del tuo gioco e scopri cosa ti manca per il 100% e dove trovarlo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Alegreya+Sans:wght@400;500&family=IM+Fell+English&family=Cinzel&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e2029; --ink:#ecebe6; --dim:#9a9caa; --rule:#343744;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Alegreya Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body)}
main{max-width:1040px;margin:0 auto;padding:72px 16px 80px;position:relative}
.lang{position:absolute;top:20px;right:16px;display:flex;gap:2px}
.lang button{font:500 14px var(--body);color:var(--dim);background:none;border:0;padding:4px 8px;cursor:pointer;border-radius:4px}
.lang button[aria-pressed=true]{color:var(--ink);background:rgba(255,255,255,.08)}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
h1{font:800 clamp(44px,8vw,88px)/.95 var(--display);letter-spacing:-.03em;margin:0 0 20px;max-width:9em}
.lede{font-size:19px;color:#c8c8d0;max-width:32em;margin:0 0 56px}
h2{font:500 15px var(--body);color:var(--dim);margin:0 0 16px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}

/* each game card carries its own game's palette */
.game{display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;padding:24px;border-radius:14px;text-decoration:none;color:inherit;min-height:160px}
.game h3{margin:0 0 4px}
.game p{margin:0;font-size:15px}
.game .tracks{margin-top:10px;font-size:14px}

.dd{background:radial-gradient(ellipse 120% 90% at 30% 0%,#4a5057,#2b2f34 60%,#1d2024);color:#e4e1d8;border:1px solid #3a3f45;transition:border-color .2s}
.dd:hover{border-color:#b9eadf}
.dd h3{font:400 30px/1.05 "IM Fell English",Georgia,serif}
.dd .tracks{color:#8f969c}
.dd svg .light{fill:#b9eadf;opacity:.85}
.dd svg .frame{fill:none;stroke:#8f969c;stroke-width:3}
.dd:hover svg .frame{stroke:#b9eadf}

.hk{background:radial-gradient(ellipse 120% 90% at 70% 0%,#26304a,#121826 60%,#0b0f17);color:#e8e6df;border:1px solid #2a3447;transition:border-color .2s}
.hk:hover{border-color:#f4f1e8}
.hk h3{font:400 26px/1.05 "Cinzel",Georgia,serif;letter-spacing:.05em}
.hk .tracks{color:#8a93a6}

.soon{border:1.5px dashed var(--rule);color:var(--dim)}
.soon h3{font:500 22px var(--display);color:var(--ink)}
.soon .slot{width:56px;height:56px;border-radius:50%;border:1.5px dashed var(--rule);justify-self:center}

footer{margin-top:72px;font-size:14px;color:var(--dim);border-top:1px solid var(--rule);padding-top:16px}
footer a{color:var(--dim)}
@media (max-width:480px){main{padding-top:48px}.game{grid-template-columns:56px 1fr;padding:20px}}
</style>
</head>
<body>
<main>
<div class="lang" role="group" aria-label="Language"><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button></div>
<h1>Game Completion Tool</h1>
<p class="lede" data-i18n="lede"></p>

<h2 data-i18n="games"></h2>
<div class="shelf">
  <a class="game dd" href="deaths-door/">
    <svg viewBox="0 0 200 300" aria-hidden="true">
      <clipPath id="ddArch"><path d="M20 300V100A80 80 0 0 1 180 100V300Z"/></clipPath>
      <path d="M20 300V100A80 80 0 0 1 180 100V300Z" fill="#0f1113"/>
      <rect class="light" x="0" y="120" width="200" height="180" clip-path="url(#ddArch)"/>
      <path class="frame" d="M8 300V100A92 92 0 0 1 192 100V300"/>
    </svg>
    <div>
      <h3>Death's Door</h3>
      <p data-i18n="ddWhat"></p>
      <p class="tracks" data-i18n="ddCount"></p>
    </div>
  </a>

  <a class="game hk" href="hollow-knight/">
    <svg viewBox="0 0 100 120" aria-hidden="true">
      <path d="M22 6c-6 14-4 30 8 40C20 56 16 70 18 86c3 20 17 30 32 30s29-10 32-30c2-16-2-30-12-40 12-10 14-26 8-40-6 10-14 18-28 20C36 24 28 16 22 6Z" fill="#f4f1e8"/>
      <ellipse cx="37" cy="82" rx="9" ry="13" fill="#0b0f17"/>
      <ellipse cx="63" cy="82" rx="9" ry="13" fill="#0b0f17"/>
    </svg>
    <div>
      <h3>Hollow Knight</h3>
      <p data-i18n="hkWhat"></p>
      <p class="tracks" data-i18n="hkCount"></p>
    </div>
  </a>

  <div class="game soon">
    <span class="slot" aria-hidden="true"></span>
    <div>
      <h3 data-i18n="next"></h3>
      <p data-i18n="wip"></p>
    </div>
  </div>
</div>

<footer data-i18n="footer"></footer>
</main>
<script src="i18n.js"></script>
<script>
const GH = '<a href="https://github.com/vincenzomarotta/game-completion-tool">GitHub</a>';
I18N.init({
  it: {
    lede: "Carica il salvataggio, scopri cosa ti manca per il 100% e in quale zona andarlo a cercare. Il file non lascia mai il tuo computer.",
    games: "Giochi", ddWhat: "Oggetti luccicanti, semi, vasi, santuari, sfere d'anima, tavolette.", ddCount: "224 cose da trovare",
    hkWhat: "Larve, frammenti, amuleti, radici, reliquie, negozi.", hkCount: "556 cose da trovare, con mappa interattiva",
    next: "Prossimo gioco", wip: "In lavorazione.",
    footer: `Progetto amatoriale, non affiliato con gli sviluppatori dei giochi. Codice su ${GH}.`,
  },
  en: {
    lede: "Load your save, see what's left for 100% and which area to look in. The file never leaves your computer.",
    games: "Games", ddWhat: "Shiny things, seeds, pots, shrines, soul orbs, tablets.", ddCount: "224 things to find",
    hkWhat: "Grubs, shards, charms, roots, relics, shops.", hkCount: "556 things to find, with an interactive map",
    next: "Next game", wip: "In the works.",
    footer: `Fan project, not affiliated with the games' developers. Code on ${GH}.`,
  },
});
</script>
</body>
</html>
