<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Completion Tool</title>
<meta name="description" content="Load your save and see what's left for 100% and where to find it. Death's Door, Hollow Knight, Silksong and Tunic.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Game Completion Tool">
<meta property="og:title" content="Game Completion Tool">
<meta property="og:description" content="Load your save and see what's left for 100% and where to find it. Death's Door, Hollow Knight, Silksong and Tunic.">
<meta property="og:url" content="https://vincenzomarotta.github.io/game-completion-tool/">
<meta property="og:image" content="https://vincenzomarotta.github.io/game-completion-tool/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Alegreya+Sans:wght@400;500&family=IM+Fell+English&family=Cinzel&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e2029; --ink:#ecebe6; --dim:#9a9caa; --rule:#343744;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Alegreya Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body)}
main{max-width:1040px;margin:0 auto;padding:72px 16px 80px;position:relative}
.lang{position:absolute;top:20px;right:16px;display:flex;gap:2px}
.lang button{font:500 14px var(--body);color:var(--dim);background:none;border:0;padding:4px 8px;cursor:pointer;border-radius:4px}
.lang button[aria-pressed=true]{color:var(--ink);background:rgba(255,255,255,.08)}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
h1{font:800 clamp(44px,8vw,88px)/.95 var(--display);letter-spacing:-.03em;margin:0 0 20px;max-width:9em}
h1{display:flex;align-items:flex-start;gap:.22em}
h1 .logo{width:.9em;height:.9em;flex:none;margin-top:.03em}
.lede{font-size:19px;color:#c8c8d0;max-width:32em;margin:0 0 56px}
h2{font:500 15px var(--body);color:var(--dim);margin:0 0 16px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}

/* each game card carries its own game's palette */
.game{display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;padding:24px;border-radius:14px;text-decoration:none;color:inherit;min-height:160px}
.game h3{margin:0 0 4px}
.game p{margin:0;font-size:15px}
.game .tracks{margin-top:10px;font-size:14px}

.dd{background:radial-gradient(ellipse 120% 90% at 30% 0%,#4a5057,#2b2f34 60%,#1d2024);color:#e4e1d8;border:1px solid #3a3f45;transition:border-color .2s}
.dd:hover{border-color:#b9eadf}
.dd h3{font:400 30px/1.05 "IM Fell English",Georgia,serif}
.dd .tracks{color:#8f969c}
.dd svg .light{fill:#b9eadf;opacity:.85}
.dd svg .frame{fill:none;stroke:#8f969c;stroke-width:3}
.dd:hover svg .frame{stroke:#b9eadf}

.hk{background:radial-gradient(ellipse 120% 90% at 70% 0%,#26304a,#121826 60%,#0b0f17);color:#e8e6df;border:1px solid #2a3447;transition:border-color .2s}
.hk:hover{border-color:#f4f1e8}
.hk h3{font:400 26px/1.05 "Cinzel",Georgia,serif;letter-spacing:.05em}
.hk .tracks{color:#8a93a6}

.tunic{background:#ece2c6;color:#1d4a55;border:1px solid #c9b98f;transition:box-shadow .2s}
.tunic:hover{box-shadow:4px 4px 0 #c9962e}
.tunic h3{font:700 34px/1 "Cormorant Garamond",Georgia,serif}
.tunic .tracks{color:#4f6f74}

.ss{background:radial-gradient(ellipse 120% 90% at 70% 0%,#4a1a20,#1c1114 60%,#120a0c);color:#efe6dc;border:1px solid #3d262c;transition:border-color .2s}
.ss:hover{border-color:#d6403f}
.ss h3{font:400 24px/1.1 "Cinzel",Georgia,serif;letter-spacing:.04em}
.ss h3 span{color:#d6403f}
.ss .tracks{color:#a8979a}

.soon{border:1.5px dashed var(--rule);color:var(--dim)}
.soon h3{font:500 22px var(--display);color:var(--ink)}
.soon .slot{width:56px;height:56px;border-radius:50%;border:1.5px dashed var(--rule);justify-self:center}

footer{margin-top:72px;font-size:14px;color:var(--dim);border-top:1px solid var(--rule);padding-top:16px}
footer a{color:var(--dim)}
@media (max-width:480px){main{padding-top:48px}.game{grid-template-columns:56px 1fr;padding:20px}}
</style>
</head>
<body>
<main>
<div class="lang" role="group" aria-label="Language"><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button></div>
<h1><img class="logo" src="favicon.svg" alt="" width="80" height="80"><span>Game Completion Tool</span></h1>
<p class="lede" data-i18n="lede"></p>

<h2 data-i18n="games"></h2>
<div class="shelf">
  <a class="game dd" href="deaths-door/">
    <svg viewBox="0 0 200 300" aria-hidden="true">
      <clipPath id="ddArch"><path d="M20 300V100A80 80 0 0 1 180 100V300Z"/></clipPath>
      <path d="M20 300V100A80 80 0 0 1 180 100V300Z" fill="#0f1113"/>
      <rect class="light" x="0" y="120" width="200" height="180" clip-path="url(#ddArch)"/>
      <path class="frame" d="M8 300V100A92 92 0 0 1 192 100V300"/>
    </svg>
    <div>
      <h3>Death's Door</h3>
      <p data-i18n="ddWhat"></p>
      <p class="tracks" data-i18n="ddCount"></p>
    </div>
  </a>

  <a class="game hk" href="hollow-knight/">
    <img src="knight.png" alt="" width="69" height="74" style="justify-self:center;image-rendering:auto">
    <div>
      <h3>Hollow Knight</h3>
      <p data-i18n="hkWhat"></p>
      <p class="tracks" data-i18n="hkCount"></p>
    </div>
  </a>

  <a class="game ss" href="silksong/">
    <img src="hornet.png" alt="" style="justify-self:center;max-width:72px">
    <div>
      <h3>Hollow Knight <span>Silksong</span></h3>
      <p data-i18n="ssWhat"></p>
      <p class="tracks" data-i18n="ssCount"></p>
    </div>
  </a>

  <a class="game tunic" href="tunic/">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M14 10 40 38H60L86 10 82 52C80 70 66 84 50 92 34 84 20 70 18 52Z" fill="#e0662a"/>
      <path d="M50 92C42 84 36 76 34 66L50 72 66 66C64 76 58 84 50 92Z" fill="#f7efe0"/>
      <circle cx="38" cy="54" r="4" fill="#1d4a55"/><circle cx="62" cy="54" r="4" fill="#1d4a55"/>
    </svg>
    <div>
      <h3>Tunic</h3>
      <p data-i18n="tuWhat"></p>
      <p class="tracks" data-i18n="tuCount"></p>
    </div>
  </a>

  <div class="game soon">
    <span class="slot" aria-hidden="true"></span>
    <div>
      <h3 data-i18n="next"></h3>
      <p data-i18n="wip"></p>
    </div>
  </div>
</div>

<footer data-i18n="footer"></footer>
</main>
<script src="i18n.js"></script>
<script>
const GH = '<a href="https://github.com/vincenzomarotta/game-completion-tool">GitHub</a>';
I18N.init({
  it: {
    lede: "Carica il salvataggio, scopri cosa ti manca per il 100% e in quale zona andarlo a cercare. Il file non lascia mai il tuo computer.",
    games: "Giochi", ddWhat: "Oggetti luccicanti, semi, vasi, santuari, sfere d'anima, tavolette.", ddCount: "224 cose da trovare e guida agli obiettivi",
    hkWhat: "Larve, frammenti, amuleti, radici, reliquie, negozi.", hkCount: "556 cose da trovare, mappa interattiva, diario e guida agli obiettivi",
    ssWhat: "Frammenti, pulci, medaglioni, rosari, segreti, strumenti.", ssCount: "1.229 cose da trovare, mappa interattiva, diario e guida agli obiettivi",
    tuWhat: "Forzieri, pagine del manuale, fate, segreti, reliquie.", tuCount: "302 cose da trovare, mini-mappe e guida agli obiettivi",
    next: "Prossimo gioco", wip: "In lavorazione.",
    footer: `Progetto amatoriale, non affiliato con gli sviluppatori dei giochi. Codice su ${GH}.`,

  en: {
    lede: "Load your save, see what's left for 100% and which area to look in. The file never leaves your computer.",
    games: "Games", ddWhat: "Shiny things, seeds, pots, shrines, soul orbs, tablets.", ddCount: "224 things to find and an achievement guide",
    hkWhat: "Grubs, shards, charms, roots, relics, shops.", hkCount: "556 things to find, interactive map, journal and achievement guide",
    ssWhat: "Shards, fleas, lockets, rosaries, secrets, tools.", ssCount: "1,229 things to find, interactive map, journal and achievement guide",
    tuWhat: "Chests, manual pages, fairies, secrets, relics.", tuCount: "302 things to find, mini maps and an achievement guide",
    next: "Next game", wip: "In the works.",
    footer: `Fan project, not affiliated with the games' developers. Code on ${GH}.`,
  },
});
</script>
</body>
</html>
