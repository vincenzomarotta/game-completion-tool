<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silksong Completionist</title>
<meta name="description" content="Load your Hollow Knight: Silksong save: interactive map of what's left for 100%, Hunter's Journal and achievement guide.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Game Completion Tool">
<meta property="og:title" content="Silksong Completionist">
<meta property="og:description" content="Load your Hollow Knight: Silksong save: interactive map of what's left for 100%, Hunter's Journal and achievement guide.">
<meta property="og:url" content="https://vincenzomarotta.github.io/game-completion-tool/silksong/">
<meta property="og:image" content="https://vincenzomarotta.github.io/game-completion-tool/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../ach.css">
<style>
:root{
  --abyss:#0c0708; --deep:#170e10; --ink:#22151a; --line:#3a252b;
  --bone:#efe6dc; --dim:#a8979a; --red:#d6403f; --gold:#e3c27c;
  --display:"Cinzel",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--bone);font:15px/1.45 var(--body);display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:inherit}
button{font-family:inherit}

.bar{display:flex;align-items:center;gap:16px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--deep);flex-wrap:wrap}
.bar h1{font:400 22px/1 var(--display);letter-spacing:.08em;margin:0;white-space:nowrap}
.bar h1 span{color:var(--red)}
.bar .back{display:inline-flex;align-items:center;gap:6px;color:var(--bone);font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 10px;background:var(--ink)}
.bar .back::before{content:"\2039";font-size:19px;line-height:.8}
.bar .back:hover{border-color:var(--red)}
.tabs{display:flex;gap:3px;margin-left:8px;background:var(--abyss);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{font-size:15px;font-weight:500;color:var(--dim);background:none;border:0;border-radius:7px;padding:7px 14px;cursor:pointer}
.tabs button:hover{color:var(--bone)}
.tabs button[aria-selected=true]{color:var(--bone);background:var(--red)}
.bar .sp{flex:1}
.lang{display:flex;gap:2px}
.lang button{font-size:13px;color:var(--dim);background:none;border:0;padding:4px 8px;cursor:pointer;border-radius:4px}
.lang button[aria-pressed=true]{color:var(--bone);background:rgba(255,255,255,.08)}

.view{flex:1;min-height:0;display:grid;grid-template-columns:350px 1fr}
.view[hidden]{display:none}
aside{background:var(--deep);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.btn{display:block;text-align:center;font-weight:700;font-size:15px;color:var(--bone);background:var(--red);border-radius:6px;padding:9px 14px;cursor:pointer}
.btn:hover{background:#e04e4c}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.path{font-size:12px;color:var(--dim);margin:0}
.path code{font:12px var(--body);color:var(--bone);background:var(--ink);padding:1px 5px;border-radius:3px;word-break:break-all}
.path button{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;padding:0 2px;font-size:12px}
#err{color:var(--red);font-size:13px}
#err:empty{display:none}
.progress h2{font:500 17px var(--body);margin:0}
.progress .pbar{height:4px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}
.progress .pbar i{display:block;height:100%;background:var(--red)}
.search input{width:100%;font:inherit;color:var(--bone);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;color:var(--bone);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.chip:hover{border-color:var(--dim)}
.spoiler-row{display:grid;gap:2px}
.spoiler-row p{margin:0;font-size:12px;color:var(--dim)}
.spoiler-row p[hidden]{display:none}
.cat li.spo{cursor:pointer}
.cat li.spo > *{filter:blur(5px);user-select:none}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}

.cats{overflow:auto;flex:1;padding:6px 0 20px}
.grp{display:flex;align-items:center;gap:8px;font:400 13px var(--display);letter-spacing:.12em;color:var(--dim);padding:12px 14px 4px;cursor:pointer}
.grp input,.vis input{width:16px;height:16px;margin:0;accent-color:var(--red);cursor:pointer}
.vis{display:flex;align-items:center;gap:8px;cursor:pointer}
.cat summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:5px 14px;cursor:pointer}
.cat summary::-webkit-details-marker{display:none}
.cat summary:hover{background:rgba(255,255,255,.03)}
.cat .ico{width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:0;padding:0;cursor:pointer}
.cat .ico:disabled{cursor:default}
.cat .ico img{width:20px;height:20px;object-fit:contain}
.cat.off .ico{filter:grayscale(1);opacity:.35}
.cat.off .nm{color:var(--dim)}
.cat .n{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.cat.done .n{color:var(--gold)}
.cat ul{list-style:none;margin:0;padding:0 14px 8px 50px}
.cat li{font-size:14px;padding:2px 0}
.cat li button{font-size:14px;color:var(--bone);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.cat li button:hover{color:var(--gold)}
.cat li.got,.cat li.got button{color:var(--dim);text-decoration:line-through}
.cat li small,.cat li .det{color:var(--dim);font-size:12px}
.cat li .det{display:block;text-decoration:none}
.cat li a{color:var(--gold);font-size:12px}
.cat .area{font-size:12px;color:var(--dim);margin:6px 0 1px;font-style:italic}

#map{min-height:0;background:#000}
.leaflet-container{font:14px var(--body);background:#000}
.leaflet-image-layer{filter:brightness(1.2)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--ink);color:var(--bone);box-shadow:0 4px 18px rgba(0,0,0,.7)}
.leaflet-popup-content{margin:12px 14px;min-width:210px}
.leaflet-popup-content h4{font:600 16px var(--body);margin:0}
.leaflet-popup-content .meta{margin:2px 0 6px;color:var(--dim);font-size:13px}
.leaflet-popup-content p{margin:4px 0 0}
.leaflet-popup-content a{color:var(--gold)}
.leaflet-popup-content .st{color:var(--red)}
.leaflet-popup-content .st.done{color:var(--gold)}
.leaflet-container a.leaflet-popup-close-button{color:var(--dim)}
.leaflet-bar a{background:var(--ink);color:var(--bone);border-color:var(--line)}
.leaflet-tooltip{background:var(--ink);color:var(--bone);border:1px solid var(--line);box-shadow:none}

.mk{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid rgba(0,0,0,.55);box-shadow:0 2px 6px rgba(0,0,0,.6);display:grid;place-items:center}
.mk > *{transform:rotate(45deg)}
.mk img{width:22px;height:22px;object-fit:contain}
.mk .face{width:24px;height:24px;border-radius:50%;background-repeat:no-repeat;background-color:rgba(0,0,0,.25)}
.mk.got{background:#4a3c40;opacity:.55}
.mk.got img,.mk.got .face{filter:grayscale(1)}
.mk.hit{box-shadow:0 0 0 3px var(--gold),0 2px 6px rgba(0,0,0,.6)}

.lbl{white-space:nowrap;text-align:center;pointer-events:none;color:#f3ece2;text-shadow:0 0 4px #000,0 0 8px #000,0 0 2px #000}
.lbl.area{font:400 var(--fa,22px)/1 var(--display);letter-spacing:.06em}
.lbl.sub{font:400 var(--fs,15px)/1 var(--display);color:#e0d4c4}
.zoom-far .lbl.sub{display:none}

.journal{flex:1;overflow:auto;padding:16px}
.journal[hidden]{display:none}
.jhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.jhead h2{font:500 19px var(--body);margin:0}
.jhead p{margin:4px 0 0;color:var(--dim);font-size:14px}
.filters{display:flex;gap:4px}
.filters button{font-size:14px;color:var(--dim);background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed=true]{color:var(--abyss);background:var(--bone);border-color:var(--bone)}
.beasts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.beast{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.beast .face{width:64px;height:64px;background-repeat:no-repeat;background-position:center;background-size:contain}
.beast.unseen .face{filter:brightness(0) drop-shadow(0 0 1px rgba(239,230,220,.5))}
.beast.done{border-color:rgba(227,194,124,.4)}
.beast h3{font:500 15px/1.2 var(--body);margin:0}
.beast p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.beast .st{color:var(--red)}
.beast.done .st{color:var(--gold)}
.beast a,.beast button.onmap{color:var(--dim);font-size:13px;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.beast .kbar{height:2px;background:var(--line);margin-top:6px}
.beast .kbar i{display:block;height:100%;background:var(--red)}
.achwrap{flex:1;overflow:auto;padding:16px;--ach-card:var(--deep);--ach-line:var(--line);--ach-ink:var(--bone);--ach-dim:var(--dim);--ach-accent:var(--red);--ach-done:var(--gold)}
.achwrap[hidden]{display:none}
footer{font-size:12px;color:var(--dim);padding:6px 14px;border-top:1px solid var(--line);background:var(--deep)}

@media (max-width:820px){
  .view{grid-template-columns:1fr;grid-template-rows:auto 60vh}
  aside{border-right:0;border-bottom:1px solid var(--line);order:2}
  #map{order:1;height:60vh}
  .cats{max-height:50vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="../" data-i18n="back">All games</a>
  <h1>Hollow Knight <span>Silksong</span></h1>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="map" aria-selected="true" data-i18n="tabMap"></button>
    <button type="button" role="tab" data-tab="journal" aria-selected="false" data-i18n="tabJournal"></button>
    <button type="button" role="tab" data-tab="ach" aria-selected="false" data-i18n="tabAch"></button>
  </nav>
  <span class="sp"></span>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button></div>
</div>

<div class="view" id="tab-map">
  <aside>
    <div class="side-top">
      <label class="btn"><input type="file" id="file" accept=".dat"><span data-i18n="load"></span></label>
      <p class="path"><span data-i18n="pathA"></span> <code id="p">%USERPROFILE%\AppData\LocalLow\Team Cherry\Hollow Knight Silksong</code><button id="cp" type="button" data-i18n="copy"></button> <span data-i18n="pathB"></span></p>
      <div id="err" role="alert"></div>
      <div class="progress"><h2 id="total"></h2><div class="pbar"><i id="pfill" style="width:0"></i></div></div>
      <div class="search"><input type="search" id="q" data-i18n-aria="search" autocomplete="off"></div>
      <div class="row">
        <button type="button" class="chip" id="showAll" data-i18n="showAll"></button>
        <button type="button" class="chip" id="hideAll" data-i18n="hideAll"></button>
        <label class="toggle"><input type="checkbox" id="showGot"> <span data-i18n="showGot"></span></label>
      </div>
      <div class="spoiler-row">
        <label class="toggle"><input type="checkbox" id="spoiler"> <span data-i18n="spoiler"></span></label>
        <p id="spoHint" data-i18n="spoHint"></p>
      </div>
    </div>
    <div class="cats" id="cats"></div>
  </aside>
  <div id="map"></div>
</div>

<section class="journal" id="tab-journal" hidden>
  <div class="jhead">
    <div><h2 id="jtotal"></h2><p data-i18n="jHint"></p></div>
    <div class="filters" role="group">
      <button type="button" data-f="all" aria-pressed="true" data-i18n="fAll"></button>
      <button type="button" data-f="todo" aria-pressed="false" data-i18n="fTodo"></button>
      <button type="button" data-f="done" aria-pressed="false" data-i18n="fDone"></button>
    </div>
  </div>
  <ul class="beasts" id="beasts"></ul>
</section>

<section class="achwrap" id="tab-ach" hidden></section>

<footer data-i18n="footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aes-js/3.1.2/index.min.js"></script>

<script src="data.js"></script>
<script src="achievements.js"></script>
<script src="guide.js"></script>
<script src="../ach.js"></script>
<script>
const STRINGS = {
  it: {
    spoiler: "Nascondi spoiler", spoHint: "Segnalini e nomi restano nascosti finché non li trovi. Clicca un nome sfocato per vederlo.",
    tabAch: "Obiettivi",
    back: "Tutti i giochi", load: "Carica il salvataggio (user1.dat)",
    pathA: "Salvataggi in", copy: "copia", copied: "copiato", pathB: "(nella cartella con il tuo ID Steam).",
    search: "Cerca", showAll: "Mostra tutto", hideAll: "Nascondi tutto", showGot: "Anche già presi",
    footer: 'Elenco oggetti e regole del salvataggio da <a href="https://github.com/Br3zzly/silksong-completionist">silksong-completionist</a> (MIT); mappa, posizioni, nemici e nomi dai file del gioco. Progetto amatoriale, non affiliato con Team Cherry.',
    notSave: "Questo file non è un salvataggio di Silksong. Scegli user1.dat (o user2-4.dat) dalla cartella dei salvataggi.",
    total: n => `${n} voci`, found: (g, n) => `${g} di ${n} trovati`,
    tabMap: "Mappa", tabJournal: "Diario del Cacciatore",
    grpCollect: "Collezionabili", grpProgress: "Progressi", grpWorld: "Luoghi e oggetti", grpCaches: "Scorte e segreti", grpEnemies: "Nemici", grpOff: "Non sulla mappa",
    jHint: "Le voci mai incontrate sono in silhouette. Il numero è quante uccisioni mancano per completare la voce.",
    fAll: "Tutte", fTodo: "Da completare", fDone: "Complete",
    jTotal: (seen, done, n) => `${seen} di ${n} incontrati, ${done} completati`, jTotalNoSave: n => `${n} voci`,
    unseen: "Mai incontrato", left: n => `${n === 1 ? "Manca 1 uccisione" : `Mancano ${n} uccisioni`}`, complete: "Completo",
    needs: n => n > 1 ? `${n} uccisioni` : "1 uccisione", onMap: "Mostra sulla mappa",
    inRoom: n => n === 0 ? "Boss o arena: si combatte in questa stanza" : n > 1 ? `${n} in questa stanza` : "1 in questa stanza",
  },
  en: {
    spoiler: "Hide spoilers", spoHint: "Pins and names stay hidden until you find them. Click a blurred name to see it.",
    tabAch: "Achievements",
    back: "All games", load: "Load your save (user1.dat)",
    pathA: "Saves are in", copy: "copy", copied: "copied", pathB: "(inside the folder named with your Steam ID).",
    search: "Search", showAll: "Show all", hideAll: "Hide all", showGot: "Include collected",
    footer: 'Item list and save rules from <a href="https://github.com/Br3zzly/silksong-completionist">silksong-completionist</a> (MIT); map, positions, enemies and names from the game files. Fan project, not affiliated with Team Cherry.',
    notSave: "This isn't a Silksong save. Pick user1.dat (or user2-4.dat) from the saves folder.",
    total: n => `${n} items`, found: (g, n) => `${g} of ${n} found`,
    tabMap: "Map", tabJournal: "Hunter's Journal",
    grpCollect: "Collectibles", grpProgress: "Progression", grpWorld: "Places and items", grpCaches: "Caches and secrets", grpEnemies: "Enemies", grpOff: "Not on the map",
    jHint: "Entries you've never met are shown as silhouettes. The number is how many kills are left to complete the entry.",
    fAll: "All", fTodo: "To complete", fDone: "Complete",
    jTotal: (seen, done, n) => `${seen} of ${n} encountered, ${done} completed`, jTotalNoSave: n => `${n} entries`,
    unseen: "Never encountered", left: n => `${n} kill${n === 1 ? "" : "s"} left`, complete: "Complete",
    needs: n => `${n} kill${n === 1 ? "" : "s"}`, onMap: "Show on map",
    inRoom: n => n === 0 ? "Boss or arena: fought in this room" : `${n} in this room`,
  },
};
// Sidebar groups -> categories: [it, en, pin art, marker colour]. Cache sections are their own categories.
const GROUPS = [
  ["grpCollect", {
    "Mask Shards": ["Frammenti di maschera", "Mask shards", "mask", "#9b2f35"], "Spool Fragments": ["Frammenti di spola", "Spool fragments", "spool", "#9b2f35"],
    "Lost Fleas": ["Pulci perdute", "Lost fleas", "flea", "#a0743a"], "Memory Lockets": ["Medaglioni della memoria", "Memory lockets", "locket", "#5b4a8f"],
    "Craftmetals": ["Craftmetal", "Craftmetals", "metal", "#4d6670"], "Mossberries": ["Bacche di muschio", "Mossberries", "berry", "#3d7d4f"],
    "Pale Oil": ["Olio pallido", "Pale oil", "core", "#5b4a8f"], "Silkeaters": ["Mangiaseta", "Silkeaters", "silkeater", "#5b4a8f"],
    "Keys": ["Chiavi", "Keys", "key", "#4d6670"], "Upgrades": ["Potenziamenti", "Upgrades", "core", "#4d6670"],
  }],
  ["grpCaches", {
    "Rosary Caches": ["Scorte di rosari", "Rosary caches", "rosary", "#8a5a2e"], "Shell Shard Caches": ["Scorte di conchiglie", "Shell shard caches", "shard", "#3f6f80"],
    "Breakable Walls": ["Muri segreti", "Breakable walls", "wall", "#5d5149"], "Void Masses": ["Masse del Vuoto", "Void masses", "void", "#3a2f45"],
    "Rhinogrunds": ["Rinogrugni", "Rhinogrunds", "beast", "#5d5149"], "Covetous Pilgrims": ["Pellegrini avidi", "Covetous pilgrims", "beast", "#5d5149"],
    "Shardillards": ["Scheggiardilli", "Shardillards", "beast", "#5d5149"],
  }],
  ["grpProgress", {
    "Abilities": ["Abilità", "Abilities", "ability", "#6b3f7a"], "Tools": ["Strumenti", "Tools", "tool", "#7a3a3a"], "Crests": ["Creste", "Crests", "crest", "#6b3f7a"],
    "Bosses": ["Boss", "Bosses", "boss", "#5a2a2a"], "Tasks": ["Desideri", "Wishes", "wish", "#7a5a2e"],
  }],
  ["grpWorld", {
    "Relics": ["Reliquie", "Relics", "relic", "#2f5f6f"], "Bellways": ["Via Campana", "Bellways", "bellway", "#5d5149"], "Ventrica Stations": ["Stazioni Ventrica", "Ventrica stations", "tube", "#5d5149"],
    "Mapping Supplies": ["Forniture per mappe", "Mapping supplies", "quill", "#4d6670"], "Bellhome": ["Casacampana", "Bellhome", "bellhome", "#4d6670"],
    "Materium": ["Materium", "Materium", "materium", "#4d6670"], "Mementos": ["Memento", "Mementos", "memento", "#5b4a8f"],
  }],
  ["grpEnemies", { Journal: ["Diario del Cacciatore", "Hunter's Journal", null, "#3b2430"] }],
  ["grpOff", { "Stats": ["Statistiche", "Stats"] }],
];
const CAT = Object.assign({}, ...GROUPS.map(g => g[1]));
const OFF = new Set(Object.keys(GROUPS[GROUPS.length - 1][1]));
const HIDDEN_BY_DEFAULT = new Set(["Rosary Caches", "Shell Shard Caches", "Breakable Walls", "Void Masses", "Rhinogrunds", "Covetous Pilgrims", "Shardillards", "Journal",
  "Bosses", "Tasks", "Materium", "Mementos", "Bellhome", "Mapping Supplies"]);
const t = I18N.t;
const en = () => I18N.lang === "en";
const gname = g => (CAT[g] || [g, g])[en() ? 1 : 0];
const zone = k => (SS.zones[k] || [k])[0];  // game names stay in English in both languages
const catOf = it => (it.c === "Caches & Secrets" || it.c === "Unique Spawns") && CAT[it.s] ? it.s : it.c;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const beastName = e => e.n;

// Same container as Hollow Knight: .NET string record holding base64 of AES-256-ECB(JSON).
const KEY = new TextEncoder().encode("UKu52ePUBwetZ9wNX88o54dnfKRu0T1l");
function parseSave(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0x7b) return JSON.parse(new TextDecoder().decode(b));
  if (b[17] !== 6) throw new Error(t("notSave"));
  let p = 22, len = 0, shift = 0, x;
  do { x = b[p++]; len |= (x & 127) << shift; shift += 7; } while (x & 128);
  const cipher = Uint8Array.from(atob(new TextDecoder("latin1").decode(b.subarray(p, p + len))), c => c.charCodeAt(0));
  const plain = new aesjs.ModeOfOperation.ecb(KEY).decrypt(cipher);
  return JSON.parse(new TextDecoder().decode(plain.subarray(0, plain.length - plain[plain.length - 1])));
}

// Port of silksong-completionist's createSaveParser (MIT).
function checker(save) {
  const pd = save.playerData, sd = save.sceneData || {};
  const first = (list, key) => { const m = new Map(); for (const e of list || []) if (!m.has(key(e))) m.set(key(e), e); return m; };
  const C = {};
  const data = (c, n) => (C[c] ??= first(pd[c]?.savedData, e => e.Name)).get(n)?.Data;
  const journal = first(pd.EnemyJournalKillData?.list, e => e.Name);
  const visited = new Set(pd.scenesVisited || []);
  const deposits = new Set((pd.MementosDeposited?.savedData || []).filter(e => e.Data?.IsDeposited).map(e => e.Name));
  const scene = {};
  for (const n of ["persistentBools", "persistentInts", "geoRocks"]) scene[n] = first(sd[n]?.serializedList, e => e.SceneName + "|" + e.ID);
  const sv = (c, id) => scene[c].get(id[0] + "|" + id[1])?.Value;
  const has = info => {
    if (Array.isArray(info)) return info.some(has);
    const id = info.internalId;
    switch (info.type) {
      case "flag": case "flagReturn": case "quill": return !!pd[id];
      case "flagAnyOf": return id.some(n => !!pd[n]);
      case "flagMin": return typeof pd[id[0]] === "number" && pd[id[0]] >= id[1];
      case "tool": return id.some(n => !!data("Tools", n)?.IsUnlocked);
      case "journal": return !!journal.get(id) && journal.get(id).Record.Kills >= 0;
      case "crest": return !!data("ToolEquips", id)?.IsUnlocked;
      case "collectable": return (data("Collectables", id)?.Amount || 0) > 0;
      case "relic": return !!data("Relics", id)?.IsCollected;
      case "materium": { const e = data("MateriumCollected", id); return !!pd.ConstructedMaterium && !!(e?.IsCollected || e?.HasSeenInRelicBoard); }
      case "quest": return !!data("QuestCompletionData", id)?.IsCompleted;
      case "sceneDataBool": return !!sv("persistentBools", id);
      case "sceneDataInt": return sv("persistentInts", id) === id[2];
      case "sceneDataIntRosaries": return sv("persistentInts", id) === -1;
      case "sceneDataIntShards": return !sv("persistentInts", id);
      case "sceneDataGeo": return !sv("geoRocks", id);
      case "sceneVisited": return visited.has(id);
      case "mementoDeposit": return deposits.has(id);
    }
    return false;
  };
  const kills = jid => journal.get(jid)?.Record.Kills;
  const steelSoul = pd.permadeathMode !== 0;
  return { has, kills, pd, inMode: it => !((it.ss && !steelSoul) || (it.cl && steelSoul)) };
}

let chk = null, got = null, filter = "all", query = "";
const shown = new Set(Object.keys(CAT).filter(g => !HIDDEN_BY_DEFAULT.has(g) && !OFF.has(g)));
const open = new Set();
const TOGGLABLE = g => !OFF.has(g);
const items = () => SS.items.map((it, i) => [it, i]).filter(([it]) => !chk || chk.inMode(it));
const matches = s => !query || s.toLowerCase().includes(query);

function beastState(e) {
  if (!chk) return { cls: "", text: t("needs", e.k) };
  const k = chk.kills(e.id);
  if (k === undefined) return { cls: "unseen", text: t("unseen") };
  return k >= e.k ? { cls: "done", text: t("complete") } : { cls: "", text: t("left", e.k - k), pct: 100 * k / e.k };
}
const faceStyle = (e, px) => e.img ? `background-image:url(${esc(e.img)});background-size:contain;background-position:center`
  : `background-image:url(bestiary.webp);background-size:${SS.cols * px}px auto;background-position:-${(e.i % SS.cols) * px}px -${Math.floor(e.i / SS.cols) * px}px`;

// ---- map
const [W, H] = SS.size;
const map = L.map("map", { crs: L.CRS.Simple, minZoom: -3, maxZoom: 1, zoomSnap: 0.25, attributionControl: false });
const bounds = [[-H, 0], [0, W]];
L.imageOverlay("map.webp", bounds).addTo(map);
map.fitBounds(bounds);
map.setMaxBounds(L.latLngBounds(bounds).pad(0.15));
const labelLayer = L.layerGroup().addTo(map);
const pinLayer = L.layerGroup().addTo(map);
const updateZoomClass = () => {
  const el = document.getElementById("map"), s = 2 ** map.getZoom();
  el.classList.toggle("zoom-far", map.getZoom() < -1.6);
  el.style.setProperty("--fa", Math.max(11, Math.min(40, 40 * s)) + "px");
  el.style.setProperty("--fs", Math.max(10, Math.min(22, 24 * s)) + "px");
};
map.on("zoomend", updateZoomClass); updateZoomClass();

function drawLabels() {
  labelLayer.clearLayers();
  for (const l of SS.labels) L.marker([-l.y, l.x], { interactive: false, keyboard: false,
    icon: L.divIcon({ className: "", html: `<div class="lbl ${l.k}">${esc(l.en)}</div>`, iconSize: [0, 0] }) }).addTo(labelLayer);
}
const markerIcon = (color, state, inner) => L.divIcon({ className: "", iconSize: [32, 32], iconAnchor: [3, 31], popupAnchor: [13, -30],
  html: `<div class="mk ${state}" style="--c:${color}">${inner}</div>` });

function itemPopup(it) {
  return `<h4>${esc(it.n)}</h4><p class="meta">${esc(gname(catOf(it)))}${it.r ? `, ${esc(zone(it.r))}` : ""}</p>
    ${it.d ? `<p>${esc(it.d)}</p>` : ""}`;
}
function enemyPopup(p) {
  const e = SS.journal[p[0]], s = beastState(e);
  return `<h4>${esc(beastName(e))}</h4><p class="meta">${esc(zone(p[3]))}, ${t("inRoom", p[4])}</p>
    <p class="st ${s.cls === "done" ? "done" : ""}">${esc(s.text)}</p>`;
}
const itemMarkers = SS.items.map(it => it.p && L.marker([-it.p[1], it.p[0]]).bindPopup(() => itemPopup(it)));
const enemyMarkers = SS.enemies.map(p => L.marker([-p[2], p[1]]).bindPopup(() => enemyPopup(p)));
// Spoiler mode (on by default): pins and names stay hidden until you've found the thing or click its name.
let spoiler = true;
try { spoiler = localStorage.getItem("spoiler") !== "off"; } catch {}
const revealedPins = new Set();
const visible = (key, known) => !spoiler || !!known || revealedPins.has(key);
const spo = (key, known) => visible(key, known) ? "" : ` spo" data-rv="${key}`;
let highlight = null;

function drawMap() {
  pinLayer.clearLayers();
  const showGot = document.getElementById("showGot").checked;
  for (const [it, i] of items()) {
    const g = catOf(it);
    if (!itemMarkers[i] || !shown.has(g) || !matches(it.n + " " + it.d)) continue;
    const done = got && got[i];
    if (done && !showGot && highlight !== "i" + i) continue;
    if (!visible("i" + i, done)) continue;
    const m = itemMarkers[i];
    m.setIcon(markerIcon(CAT[g]?.[3] || "#555", (done ? "got" : "") + (highlight === "i" + i ? " hit" : ""), `<img src="pins/${it.i}.png" alt="">`));
    m.setZIndexOffset(done ? -1000 : 0);
    m.unbindTooltip().bindTooltip(it.n, { direction: "top", offset: [13, -30] });
    m.addTo(pinLayer);
  }
  if (shown.has("Journal")) SS.enemies.forEach((p, j) => {
    const e = SS.journal[p[0]], s = beastState(e);
    if ((s.cls === "done" && !showGot && highlight !== "e" + p[0]) || !matches(beastName(e) + " " + e.n)) return;
    if (!visible("e" + p[0], chk && s.cls !== "unseen")) return;
    const m = enemyMarkers[j];
    m.setIcon(markerIcon(CAT.Journal[3], (s.cls === "done" ? "got" : "") + (highlight === "e" + p[0] ? " hit" : ""), `<span class="face" style="${faceStyle(e, 24)}"></span>`));
    m.unbindTooltip().bindTooltip(beastName(e), { direction: "top", offset: [13, -30] });
    m.addTo(pinLayer);
  });
}

// ---- sidebar
function drawList() {
  const showGot = document.getElementById("showGot").checked;
  const all = items();
  let html = "";
  GROUPS.forEach(([gkey, cats], gi) => {
    const gs = Object.keys(cats).filter(TOGGLABLE), on = gs.filter(g => shown.has(g)).length;
    html += gs.length ? `<label class="grp" data-grp="${gi}"><input type="checkbox"${on === gs.length ? " checked" : ""} data-mixed="${+(on > 0 && on < gs.length)}"> ${t(gkey)}</label>` : `<div class="grp">${t(gkey)}</div>`;
    for (const g of Object.keys(cats)) {
      let n, total, body;
      if (g === "Journal") {
        const ents = SS.journal.map((e, i) => [e, i, beastState(e)]);
        total = ents.length; n = chk ? ents.filter(([, , s]) => s.cls === "done").length : 0;
        body = ents.filter(([e, , s]) => (showGot || s.cls !== "done") && matches(beastName(e) + " " + e.n))
          .map(([e, i, s]) => `<li class="${s.cls === "done" ? "got" : ""}${spo("e" + i, chk && s.cls !== "unseen")}"><button type="button" data-e="${i}">${esc(beastName(e))}</button> <small>${esc(s.text)}</small></li>`).join("");
      } else {
        const rows = all.filter(([it]) => catOf(it) === g);
        if (!rows.length) continue;
        total = rows.length; n = got ? rows.filter(([, i]) => got[i]).length : 0;
        const list = rows.filter(([it, i]) => (showGot || !got || !got[i]) && matches(it.n + " " + it.d));
        const areas = {};
        for (const [it, i] of list) (areas[it.r ? zone(it.r) : ""] ??= []).push([it, i]);
        body = Object.entries(areas).map(([a, rs]) => `${a ? `<div class="area">${esc(a)}</div>` : ""}${rs.map(([it, i]) =>
          `<li class="${got && got[i] ? "got" : ""}${spo("i" + i, got && got[i])}">${it.p ? `<button type="button" data-i="${i}">${esc(it.n)}</button>` : esc(it.n)}${!it.p && it.d ? `<span class="det">${esc(it.d)}</span>` : ""}</li>`).join("")}`).join("");
      }
      const c = cats[g];
      const ico = c[2] ? `<img src="pins/${c[2]}.png" alt="">` : g === "Journal" ? `<span style="width:20px;height:20px;border-radius:50%;${faceStyle(SS.journal[0], 20)}"></span>` : "";
      html += `<details class="cat${shown.has(g) || OFF.has(g) ? "" : " off"}${got && n === total ? " done" : ""}" data-g="${esc(g)}"${open.has(g) || query ? " open" : ""}>
        <summary>${OFF.has(g) ? "<span></span>" : `<label class="vis" data-toggle="${esc(g)}"><input type="checkbox"${shown.has(g) ? " checked" : ""} aria-label="${esc(gname(g))}"><span class="ico" style="--c:${c[3]}">${ico}</span></label>`}
        <span class="nm">${esc(gname(g))}</span><span class="n">${got || (g === "Journal" && chk) ? `${n}/` : ""}${total}</span></summary><ul>${body}</ul></details>`;
    }
  });
  document.getElementById("cats").innerHTML = html;
  document.querySelectorAll("#cats [data-mixed='1']").forEach(x => x.indeterminate = true);
  const total = all.length, n = got ? all.filter(([, i]) => got[i]).length : 0;
  document.getElementById("total").textContent = got ? t("found", n, total) : t("total", total);
  document.getElementById("pfill").style.width = got ? `${100 * n / total}%` : "0";
}

// ---- journal grid
function drawJournal() {
  const rows = SS.journal.map((e, i) => [e, i, beastState(e)]);
  const seen = rows.filter(([, , s]) => s.cls !== "unseen").length, done = rows.filter(([, , s]) => s.cls === "done").length;
  document.getElementById("jtotal").textContent = chk ? t("jTotal", seen, done, rows.length) : t("jTotalNoSave", rows.length);
  const pinned = new Set(SS.enemies.map(p => p[0]));
  document.getElementById("beasts").innerHTML = rows
    .filter(([, , s]) => filter === "all" || !chk || (filter === "done") === (s.cls === "done"))
    .map(([e, i, s]) => `<li class="beast ${s.cls}"><div class="face" style="${faceStyle(e, 64)}" role="img" aria-label="${esc(beastName(e))}"></div>
      <div><h3>${esc(beastName(e))}</h3><p class="st">${esc(s.text)}</p>
        ${pinned.has(i) ? `<p><button type="button" class="onmap" data-e="${i}">${t("onMap")}</button></p>` : ""}
        ${s.pct !== undefined ? `<div class="kbar"><i style="width:${s.pct}%"></i></div>` : ""}</div></li>`).join("");
}

const SAVE_PD = () => chk && chk.pd;
// Achievement checks on playerData: a field name, a function, or null when the save doesn't record it
const SS_CRESTS = ["Reaper", "Wanderer", "Warrior", "Witch", "Toolmaster", "Spell"];
const sect = (pred, k) => {  // all (or at least k) of the tracked items matching pred are collected
  const r = SS.items.map((it, i) => [it, i]).filter(([it]) => pred(it) && chk.inMode(it)), n = r.filter(([, i]) => got[i]).length;
  return k ? n >= k : n === r.length;
};
const inSec = name => it => it.s === name || it.c === name;
const quest = id => () => chk.has({ type: "quest", internalId: id });
const ended = p => p.CompletedEndings > 0;
const ACH_CHECK = {
  FIRST_TOOL: () => sect(inSec("Tools"), 1), ALL_TOOLS: () => sect(inSec("Tools")),
  FIRST_SILK_SKILL: () => sect(inSec("Silk Skills"), 1), ALL_SILK_SKILLS: () => sect(inSec("Silk Skills")),
  FIRST_CREST: () => SS_CRESTS.some(c => chk.has({ type: "crest", internalId: c })), ALL_CRESTS: () => SS_CRESTS.every(c => chk.has({ type: "crest", internalId: c })),
  FIRST_MASK: () => sect(inSec("Mask Shards"), 4), ALL_MASKS: () => sect(inSec("Mask Shards")),
  FIRST_SILK_SPOOL: () => sect(inSec("Spool Fragments"), 2), ALL_SILK_SPOOLS: () => sect(inSec("Spool Fragments")),
  ALL_SILK_HEARTS: () => sect(inSec("Silk Hearts")), ALL_MAPS: () => sect(inSec("Maps")),
  BELLWAYS_FULL: () => sect(inSec("Bellways")), BELLWAY_MELODY: "UnlockedFastTravelTeleport", TUBES_FULL: () => sect(inSec("Ventrica Stations")),
  JOURNAL_HALF: quest("Journal"), JOURNAL_FULL: "nuuMementoAwarded", FLEAS_HALF: () => sect(inSec("Lost Fleas"), 15), FLEAS_ALL: () => sect(inSec("Lost Fleas")),
  DEFEATED_BELLBEAST: "defeatedBellBeast", DEFEATED_LACE_1: "defeatedLace1", DEFEATED_SONG_GOLEM: "defeatedSongGolem", DEFEATED_WIDOW: "spinnerDefeated",
  DEFEATED_LAST_JUDGE_1: "defeatedLastJudge", DEFEATED_COGWORK_DANCERS: "defeatedCogworkDancers", DEFEATED_TROBBIO: "defeatedTrobbio",
  DEFEATED_LACE_2: "defeatedLaceTower", DEFEATED_PHANTOM_1: "defeatedPhantom", DEFEATED_FIRST_SINNER: "defeatedFirstWeaver",
  DEFEATED_CORAL_KING: "defeatedCoralKing", DEFEATED_FLOWER_QUEEN: "defeatedFlowerQueen", DEFEATED_HUNTER_QUEEN: "defeatedAntQueen",
  DEFEATED_GREEN_PRINCE: "defeatedCloverDancers",
  FIRST_WISH: () => sect(it => it.c === "Tasks" && it.s.startsWith("Wishes"), 1), GOURMAND_WISH: quest("Great Gourmand"),
  SHAKRA_FINAL_QUEST: quest("Shakra Final Quest"), GARMOND_FINAL_QUEST: "garmondBlackThreadDefeated", PINSTRESS_WISH: quest("Pinstress Battle"),
  EVA_FINAL_QUEST: "HasBoundCrestUpgrader", BELLHOME: "BelltownHouseUnlocked", CITADEL_SONG: "UnlockedMelodyLift",
  WHITE_FLOWER_GAINED: () => chk.has({ type: "collectable", internalId: "White Flower" }),
  // CompletedEndings is a bit set: 1 Act 2 ending, 2 cursed, 4 Soul Snare, 8 Act 3 ending
  ENDING_A: p => p.CompletedEndings & 1, ENDING_D: p => p.CompletedEndings & 2, ENDING_C: p => p.CompletedEndings & 4, ENDING_E: p => p.CompletedEndings & 8,
  HERALD_WISH: null, COMPLETION: p => ended(p) && p.completionPercentage >= 100, SPEEDRUN_1: p => ended(p) && p.playTime < 18000,
  SPEED_COMPLETION: p => ended(p) && p.completionPercentage >= 100 && p.playTime < 108000,
  STEEL_SOUL: p => ended(p) && p.permadeathMode > 0, STEEL_SOUL_FULL: p => ended(p) && p.permadeathMode > 0 && p.completionPercentage >= 100,
};


const achCheck = k => {
  const p = SAVE_PD(), f = ACH_CHECK[k];
  if (!p) return undefined;
  return f == null ? null : !!(typeof f === "string" ? p[f] : f(p));
};
ACH_UI.init(document.getElementById("tab-ach"), { wiki: "https://hollowknight.wiki/w/Achievements_(Silksong)", check: achCheck });
function render() { drawMap(); drawList(); drawJournal(); ACH_UI.draw(); }

function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === name));
  document.getElementById("tab-map").hidden = name !== "map";
  document.getElementById("tab-journal").hidden = name !== "journal";
  document.getElementById("tab-ach").hidden = name !== "ach";
  if (name === "map") map.invalidateSize();
}
function focusEnemy(ei) {
  const j = SS.enemies.findIndex(p => p[0] === ei);
  showTab("map");
  if (j < 0) return;
  shown.add("Journal"); highlight = "e" + ei; revealedPins.add("e" + ei); render();
  map.flyTo([-SS.enemies[j][2], SS.enemies[j][1]], 0, { duration: .6 });
  setTimeout(() => enemyMarkers[j].openPopup(), 650);
}

document.getElementById("cats").addEventListener("click", e => {
  const sp = e.target.closest("li.spo");
  if (sp) {  // spoiler mode: the first click reveals the name (and its pin, through the button handler below)
    revealedPins.add(sp.dataset.rv);
    if (!e.target.closest("button")) { drawMap(); drawList(); return; }
  }
  const gp = e.target.closest("[data-grp]");
  if (gp) {  // group checkbox: all on unless they already all are
    e.preventDefault();
    const gs = Object.keys(GROUPS[+gp.dataset.grp][1]).filter(TOGGLABLE);
    const all = gs.every(g => shown.has(g));
    gs.forEach(g => all ? shown.delete(g) : shown.add(g));
    drawMap(); drawList();
    return;
  }
  const tog = e.target.closest("[data-toggle]");
  if (tog) {
    e.preventDefault();
    const g = tog.dataset.toggle;
    shown.has(g) ? shown.delete(g) : shown.add(g);
    drawMap(); drawList();
    return;
  }
  const btn = e.target.closest("button[data-i]");
  if (btn) {
    const i = +btn.dataset.i, it = SS.items[i];
    shown.add(catOf(it)); highlight = "i" + i; render();
    map.flyTo([-it.p[1], it.p[0]], 0, { duration: .6 });
    setTimeout(() => itemMarkers[i].openPopup(), 650);
    return;
  }
  const eb = e.target.closest("button[data-e]");
  if (eb) focusEnemy(+eb.dataset.e);
});
document.getElementById("beasts").addEventListener("click", e => { const b = e.target.closest("button[data-e]"); if (b) focusEnemy(+b.dataset.e); });
document.getElementById("cats").addEventListener("toggle", e => {
  const g = e.target.dataset.g;
  if (g && !query) e.target.open ? open.add(g) : open.delete(g);
}, true);
document.getElementById("showGot").onchange = render;
document.getElementById("spoiler").checked = spoiler;
document.getElementById("spoHint").hidden = !spoiler;
document.getElementById("spoiler").onchange = e => {
  spoiler = e.target.checked;
  try { localStorage.setItem("spoiler", spoiler ? "on" : "off"); } catch {}
  document.getElementById("spoHint").hidden = !spoiler;
  drawMap(); drawList();
};

document.getElementById("showAll").onclick = () => { Object.keys(CAT).filter(g => !OFF.has(g)).forEach(g => shown.add(g)); drawMap(); drawList(); };
document.getElementById("hideAll").onclick = () => { shown.clear(); drawMap(); drawList(); };
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); drawMap(); drawList(); });
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("[data-f]");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  drawJournal();
});

async function load(file) {
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    chk = checker(parseSave(await file.arrayBuffer()));
    got = SS.items.map(it => chk.has(it.t));
    render();
  } catch (e) {
    err.textContent = e instanceof SyntaxError || e instanceof TypeError ? t("notSave") : e.message;
  }
}
document.getElementById("file").onchange = e => e.target.files[0] && load(e.target.files[0]);
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); });
document.getElementById("cp").onclick = e => {
  navigator.clipboard?.writeText(document.getElementById("p").textContent);
  e.target.textContent = t("copied");
};
I18N.init(STRINGS, () => {
  document.getElementById("err").textContent = "";
  document.getElementById("q").placeholder = t("search");
  drawLabels(); render();
});
</script>
