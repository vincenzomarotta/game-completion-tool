<html lang="en">
<head>

<style>
:root{
  --abyss:#07090d; --deep:#0f141d; --ink:#171e2a; --line:#262f40;
  --bone:#e8e6df; --dim:#8a93a6; --soul:#f4f1e8; --amber:#f0b45a;
  --display:"Cinzel",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--bone);font:15px/1.45 var(--body);display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--soul);outline-offset:2px}
a{color:inherit}
button{font-family:inherit}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--deep);flex-wrap:wrap}
.bar h1{font:400 22px/1 var(--display);letter-spacing:.08em;margin:0;white-space:nowrap}
.bar .back{display:inline-flex;align-items:center;gap:6px;color:var(--bone);font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 10px;background:var(--ink)}
.bar .back::before{content:"\2039";font-size:19px;line-height:.8}
.bar .back:hover{border-color:var(--amber)}
.tabs{display:flex;gap:3px;margin-left:8px;background:var(--abyss);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{font-size:15px;font-weight:500;color:var(--dim);background:none;border:0;border-radius:7px;padding:7px 14px;cursor:pointer}
.tabs button:hover{color:var(--bone)}
.tabs button[aria-selected=true]{color:var(--abyss);background:var(--amber)}
.bar .sp{flex:1}
.lang{display:flex;gap:2px}
.lang button{font-size:13px;color:var(--dim);background:none;border:0;padding:4px 8px;cursor:pointer;border-radius:4px}
.lang button[aria-pressed=true]{color:var(--bone);background:rgba(255,255,255,.08)}

/* map view: sidebar left, map right */
.view{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr}
.view[hidden]{display:none}
aside{background:var(--deep);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.btn{display:block;text-align:center;font-weight:700;font-size:15px;color:var(--abyss);background:var(--soul);border-radius:6px;padding:9px 14px;cursor:pointer}
.btn:hover{background:#fff}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.path{font-size:12px;color:var(--dim);margin:0}
.path code{font:12px var(--body);color:var(--bone);background:var(--ink);padding:1px 5px;border-radius:3px;word-break:break-all}
.path button{background:none;border:0;color:var(--soul);text-decoration:underline;cursor:pointer;padding:0 2px;font-size:12px}
#err{color:var(--amber);font-size:13px}
#err:empty{display:none}
.progress h2{font:500 17px var(--body);margin:0}
.progress .pbar{height:4px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}
.progress .pbar i{display:block;height:100%;background:var(--amber)}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;font:inherit;color:var(--bone);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;color:var(--bone);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.chip:hover{border-color:var(--dim)}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}

.cats{overflow:auto;flex:1;padding:6px 0 20px}
.grp{font:400 13px var(--display);letter-spacing:.12em;color:var(--dim);padding:12px 14px 4px}
.cat summary{list-style:none;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:5px 14px;cursor:pointer}
.cat summary::-webkit-details-marker{display:none}
.cat summary:hover{background:rgba(255,255,255,.03)}
.cat .ico{width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:0;padding:0;cursor:pointer}
.cat .ico img{width:20px;height:20px;object-fit:contain}
.cat.off .ico{filter:grayscale(1);opacity:.35}
.cat.off .nm{color:var(--dim)}
.cat .n{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.cat.done .n{color:var(--amber)}
.cat ul{list-style:none;margin:0;padding:0 14px 8px 50px}
.cat li button{font-size:14px;color:var(--bone);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left}
.cat li button:hover{color:var(--amber)}
.cat li.got button{color:var(--dim);text-decoration:line-through}
.cat li small{color:var(--dim)}
.cat .area{font-size:12px;color:var(--dim);margin:6px 0 1px;font-style:italic}

#map{min-height:0;background:#000}
.leaflet-container{font:14px var(--body);background:#000}
.leaflet-image-layer{filter:brightness(1.3)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--ink);color:var(--bone);box-shadow:0 4px 18px rgba(0,0,0,.7)}
.leaflet-popup-content{margin:12px 14px;min-width:200px}
.leaflet-popup-content h4{font:600 16px var(--body);margin:0}
.leaflet-popup-content .meta{margin:2px 0 6px;color:var(--dim);font-size:13px}
.leaflet-popup-content ul{margin:6px 0 0;padding-left:16px}
.leaflet-popup-content li.got{color:var(--dim);text-decoration:line-through}
.leaflet-popup-content .st{color:var(--amber)}
.leaflet-popup-content .st.done{color:var(--soul)}
.leaflet-container a.leaflet-popup-close-button{color:var(--dim)}
.leaflet-bar a{background:var(--ink);color:var(--bone);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--line)}
.leaflet-tooltip{background:var(--ink);color:var(--bone);border:1px solid var(--line);box-shadow:none}

/* teardrop markers */
.mk{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid rgba(0,0,0,.55);box-shadow:0 2px 6px rgba(0,0,0,.6);display:grid;place-items:center}
.mk > *{transform:rotate(45deg)}
.mk img{width:22px;height:22px;object-fit:contain}
.mk .face{width:24px;height:24px;border-radius:50%;background-repeat:no-repeat;background-color:rgba(0,0,0,.25)}
.mk.got{background:#3a4150;opacity:.55}
.mk.got img,.mk.got .face{filter:grayscale(1)}
.mk.hit{box-shadow:0 0 0 3px var(--amber),0 2px 6px rgba(0,0,0,.6)}

/* map labels */
.lbl{white-space:nowrap;text-align:center;pointer-events:none;color:#f1efe7;text-shadow:0 0 4px #000,0 0 8px #000,0 0 2px #000}
.lbl.area{font:400 var(--fa,22px)/1 var(--display);letter-spacing:.06em}
.lbl.sub{font:400 var(--fs,15px)/1 var(--display);color:#d9d4c5}
.zoom-far .lbl.sub{display:none}

/* journal grid */
.journal{flex:1;overflow:auto;padding:16px}
.journal[hidden]{display:none}
.jhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.jhead h2{font:500 19px var(--body);margin:0}
.jhead p{margin:4px 0 0;color:var(--dim);font-size:14px}
.filters{display:flex;gap:4px}
.filters button{font-size:14px;color:var(--dim);background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed=true]{color:var(--abyss);background:var(--soul);border-color:var(--soul)}
.beasts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.beast{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.beast .face{width:64px;height:64px;background-repeat:no-repeat}
.beast.unseen .face{filter:brightness(0) drop-shadow(0 0 1px rgba(232,230,223,.5))}
.beast.done{border-color:rgba(244,241,232,.35)}
.beast h3{font:500 15px/1.2 var(--body);margin:0}
.beast p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.beast .st{color:var(--amber)}
.beast.done .st{color:var(--soul)}
.beast a,.beast button.onmap{color:var(--dim);font-size:13px;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.beast .kbar{height:2px;background:var(--line);margin-top:6px}
.beast .kbar i{display:block;height:100%;background:var(--amber)}
/* achievements */
.achs{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ach{align-items:start}
.ach p.d{color:var(--bone)}
.ach .tip{font-style:italic}
.ach.unknown .st{color:var(--dim)}
.ach.secret h3,.ach.secret p.d,.ach.secret .tip{filter:blur(6px);user-select:none}
.ach.secret .face{filter:blur(4px)}
.ach .reveal{margin-top:6px;font-size:13px;color:var(--bone);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.jhead a{color:inherit}
footer{font-size:12px;color:var(--dim);padding:6px 14px;border-top:1px solid var(--line);background:var(--deep)}

@media (max-width:820px){
  .view{grid-template-columns:1fr;grid-template-rows:auto 60vh}
  aside{max-height:none;border-right:0;border-bottom:1px solid var(--line);order:2}
  #map{order:1;height:60vh}
  .cats{max-height:50vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="../" data-i18n="back">All games</a>
  <h1>Hollow Knight</h1>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="map" aria-selected="true" data-i18n="tabMap"></button>

  </nav>
  <span class="sp"></span>

<div class="view" id="tab-map">
  <aside>
    <div class="side-top">

      <p class="path"><span data-i18n="pathA"></span> <code id="p">%USERPROFILE%\AppData\LocalLow\Team Cherry\Hollow Knight</code><button id="cp" type="button" data-i18n="copy"></button></p>

      <div class="row">

      <button type="button" data-f="done" aria-pressed="false" data-i18n="fDone"></button>
    </div>
  </div>
  <ul class="beasts" id="beasts"></ul>
</section>

<section class="journal" id="tab-ach" hidden>
  <div class="jhead">
    <div><h2 id="atotal"></h2><p data-i18n="aHint"></p></div>
    <div class="filters" id="afilters" role="group">
      <button type="button" data-f="all" aria-pressed="true" data-i18n="fAll"></button>
      <button type="button" data-f="todo" aria-pressed="false" data-i18n="fTodo"></button>
      <button type="button" data-f="done" aria-pressed="false" data-i18n="fDone"></button>
    </div>

</section>

<footer data-i18n="footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script src="enemies.js"></script>
<script>
const STRINGS = {
  it: {
    tabAch: "Obiettivi", aDone: "Fatto in questo salvataggio", aTodo: "Non ancora in questo salvataggio", aUnknown: "Non si vede dal salvataggio",
    aReveal: "Obiettivo segreto: mostra", aTotal: (d, n) => `${d} di ${n} fatti in questo salvataggio`, aTotalNoSave: n => `${n} obiettivi`,
    aHint: 'Lo stato viene dal salvataggio: dice cosa ha fatto questa partita, non cosa ha sbloccato Steam. Guida completa sulla <a href="https://hollowknight.wiki/w/Achievements" target="_blank" rel="noopener">wiki</a>.',
    back: "Tutti i giochi", load: "Carica il salvataggio (user1.dat)",
    pathA: "Salvataggi in", copy: "copia", copied: "copiato",
    search: "Cerca", showAll: "Mostra tutto", hideAll: "Nascondi tutto", showGot: "Anche già presi",
    footer: 'Posizioni da <a href="https://github.com/syyePhenomenol/MapChanger">MapChanger</a> e <a href="https://github.com/homothetyhk/RandomizerMod">RandomizerMod</a>; mappa, nemici e diario dai file del gioco. Progetto amatoriale, non affiliato con Team Cherry.',
    notSave: "Questo file non è un salvataggio di Hollow Knight. Scegli user1.dat (o user2-4.dat) dalla cartella dei salvataggi.",
    total: n => `${n} posizioni`, found: (g, n) => `${g} di ${n} trovati`, inShop: s => `Da ${s}`,
    tabMap: "Mappa", tabJournal: "Diario del Cacciatore",
    grpCollect: "Collezionabili", grpProgress: "Progressi", grpWorld: "Luoghi e oggetti", grpGeo: "Geo", grpEnemies: "Nemici",
    jHint: "Le voci mai incontrate sono in silhouette. Il numero è quante uccisioni mancano per sbloccare le note del Cacciatore.",
    fAll: "Tutte", fTodo: "Da completare", fDone: "Complete",
    jTotal: (seen, done, n) => `${seen} di ${n} incontrati, ${done} completati`, jTotalNoSave: n => `${n} voci`,
    unseen: "Mai incontrato", left: n => `${n === 1 ? "Manca 1 uccisione" : `Mancano ${n} uccisioni`}`, complete: "Completo",
    needs: n => n > 1 ? `${n} uccisioni` : "1 uccisione", wiki: "wiki", onMap: "Mostra sulla mappa",
    inRoom: n => n === 0 ? "Boss o arena: si combatte in questa stanza" : n > 1 ? `${n} in questa stanza` : "1 in questa stanza", noPins: "Non è un nemico fisso: compare durante un combattimento.",
  },
  en: {
    tabAch: "Achievements", aDone: "Done in this save", aTodo: "Not yet in this save", aUnknown: "Can't tell from the save",
    aReveal: "Secret achievement: show", aTotal: (d, n) => `${d} of ${n} done in this save`, aTotalNoSave: n => `${n} achievements`,
    aHint: 'Status comes from your save: it shows what this playthrough has done, not what Steam has unlocked. Full guide on the <a href="https://hollowknight.wiki/w/Achievements" target="_blank" rel="noopener">wiki</a>.',
    back: "All games", load: "Load your save (user1.dat)",
    pathA: "Saves are in", copy: "copy", copied: "copied",
    search: "Search", showAll: "Show all", hideAll: "Hide all", showGot: "Include collected",
    footer: 'Locations from <a href="https://github.com/syyePhenomenol/MapChanger">MapChanger</a> and <a href="https://github.com/homothetyhk/RandomizerMod">RandomizerMod</a>; map, enemies and journal from the game files. Fan project, not affiliated with Team Cherry.',
    notSave: "This isn't a Hollow Knight save. Pick user1.dat (or user2-4.dat) from the saves folder.",
    total: n => `${n} locations`, found: (g, n) => `${g} of ${n} found`, inShop: s => `From ${s}`,
    tabMap: "Map", tabJournal: "Hunter's Journal",
    grpCollect: "Collectibles", grpProgress: "Progression", grpWorld: "Places and items", grpGeo: "Geo", grpEnemies: "Enemies",
    jHint: "Entries you've never met are shown as silhouettes. The number is how many kills are left to unlock the Hunter's notes.",
    fAll: "All", fTodo: "To complete", fDone: "Complete",
    jTotal: (seen, done, n) => `${seen} of ${n} encountered, ${done} completed`, jTotalNoSave: n => `${n} entries`,
    unseen: "Never encountered", left: n => `${n} kill${n === 1 ? "" : "s"} left`, complete: "Complete",
    needs: n => `${n} kill${n === 1 ? "" : "s"}`, wiki: "wiki", onMap: "Show on map",
    inRoom: n => n === 0 ? "Boss or arena: fought in this room" : `${n} in this room`, noPins: "Not a fixed enemy: it only appears during a fight.",
  },
};
// Sidebar groups -> categories: [it, en, pin art, marker colour]
const GROUPS = [
  ["grpCollect", {
    MaskShards: ["Frammenti di maschera", "Mask shards", "Mask", "#9b3434"], VesselFragments: ["Frammenti di vaso", "Vessel fragments", "Vessel", "#9b3434"],
    CharmNotches: ["Tacche per amuleti", "Charm notches", "Notch", "#9b3434"], PaleOre: ["Minerale pallido", "Pale ore", "Ore", "#9b3434"],
    Grubs: ["Larve", "Grubs", "Grub", "#3d7d4f"], WhisperingRoots: ["Radici sussurranti", "Whispering roots", "Root", "#a3842a"],
    Relics: ["Reliquie", "Relics", "Relic", "#2f5f8f"], RancidEggs: ["Uova rancide", "Rancid eggs", "Egg", "#2f5f8f"],
    GrimmkinFlames: ["Fiamme dei Grimmkin", "Grimmkin flames", "Flame", "#a33a2a"],
  }],
  ["grpProgress", {
    Charms: ["Amuleti", "Charms", "Charm", "#5b4a9b"], Skills: ["Abilità e incantesimi", "Skills and spells", "Skill", "#5b4a9b"],
    Dreamers: ["Sognatori", "Dreamers", "Dreamer", "#5b4a9b"], BossEssence: ["Essenza dei boss", "Boss essence", "EssenceBoss", "#a3842a"],
    JournalEntries: ["Voci del diario", "Journal entries", "Journal", "#2c5a6a"],
  }],
  ["grpWorld", {
    Shops: ["Negozi", "Shops", "Shop", "#3e6c74"], Maps: ["Mappe", "Maps", "Map", "#3e6c74"], Stags: ["Stazioni del cervo", "Stag stations", "Stag", "#3e6c74"],
    Keys: ["Chiavi", "Keys", "Key", "#3e6c74"],
  }],
  ["grpGeo", {
    GeoChests: ["Forzieri di geo", "Geo chests", "Geo", "#7c6436"], BossGeo: ["Geo dei boss", "Boss geo", "Geo", "#7c6436"],
    Mimics: ["Larve mimiche", "Grub mimics", "UnknownGrub", "#7c6436"], GeoRocks: ["Rocce di geo", "Geo rocks", "Rock", "#7c6436"],
  }],
  ["grpEnemies", { Journal: ["Diario del Cacciatore", "Hunter's Journal", null, "#24465a"] }],
];
const CAT = Object.assign({}, ...GROUPS.map(g => g[1]));
const HIDDEN_BY_DEFAULT = new Set(["GeoRocks", "Journal"]);
const t = I18N.t;
const en = () => I18N.lang === "en";
const gname = g => CAT[g][en() ? 1 : 0];
const zone = k => (HK.zones[k] || ["", ""])[en() ? 0 : 1];
const pretty = s => s.replace(/^[^-]+-/, "").replace(/_/g, " ");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const B = HK_BESTIARY;
const beastName = e => (en() ? e.en : e.it) || e.en;

// A save is a .NET BinaryFormatter string record holding base64 of AES-256-ECB(JSON).
const KEY = new TextEncoder().encode("UKu52ePUBwetZ9wNX88o54dnfKRu0T1l");
function parseSave(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0x7b) return JSON.parse(new TextDecoder().decode(b));
  if (b[17] !== 6) throw new Error(t("notSave"));
  let p = 22, len = 0, shift = 0, x;
  do { x = b[p++]; len |= (x & 127) << shift; shift += 7; } while (x & 128);
  const cipher = Uint8Array.from(atob(new TextDecoder("latin1").decode(b.subarray(p, p + len))), c => c.charCodeAt(0));
  const plain = new aesjs.ModeOfOperation.ecb(KEY).decrypt(cipher);
  return JSON.parse(new TextDecoder().decode(plain.subarray(0, plain.length - plain[plain.length - 1])));
}

function checker(save) {
  const pd = save.playerData, sd = save.sceneData;
  const scene = new Set([
    ...sd.persistentBoolItems.filter(i => i.activated).map(i => i.id + "|" + i.sceneName),
    ...sd.geoRocks.filter(i => i.hitsLeft <= 0).map(i => i.id + "|" + i.sceneName),
  ]);
  const has = tr => {
    switch (tr[0]) {
      case "b": return !!pd[tr[1]];
      case "i": return (pd[tr[1]] || 0) >= tr[2];
      case "l": return (pd[tr[1]] || []).includes(tr[2]);
      case "s": return scene.has(tr[1] + "|" + tr[2]);
      case "u": return tr[1].some(has);
      case "c": return tr[1].every(has);
    }
  };
  return has;
}

// Rows: one per collectible (shops expand into purchases). Enemy pins come from HK_ENEMIES.
const ROWS = HK.locs.flatMap((l, i) => l.sub
  ? l.sub.map(([name, tr]) => ({ loc: i, g: l.g, a: l.a, name: name.replace(/_/g, " "), place: l.n.replace(/_/g, " "), tr }))
  : [{ loc: i, g: l.g, a: l.a, name: pretty(l.n), tr: l.t }]);
const ENEMY_PINS = B.entries.flatMap((e, ei) => (HK_ENEMIES[e.id] || []).map(([x, y, a, n]) => ({ ei, x, y, a, n })));
let got = null, pd = null, filter = "all", query = "";
const shown = new Set(Object.keys(CAT).filter(g => !HIDDEN_BY_DEFAULT.has(g)));
const open = new Set();

function beastState(e) {
  if (!pd) return { cls: "", text: t("needs", Math.max(e.k, 1)) };
  if (!pd["killed" + e.id]) return { cls: "unseen", text: t("unseen") };
  const left = pd["kills" + e.id] || 0;
  return left > 0 ? { cls: "", text: t("left", left), pct: 100 * (e.k - left) / e.k } : { cls: "done", text: t("complete") };
}

// ---- map
const [W, H] = HK.size;
const map = L.map("map", { crs: L.CRS.Simple, minZoom: -3, maxZoom: 1, zoomSnap: 0.25, attributionControl: false, zoomControl: true });
const bounds = [[-H, 0], [0, W]];
L.imageOverlay("map.webp", bounds).addTo(map);
map.fitBounds(bounds);
map.setMaxBounds(L.latLngBounds(bounds).pad(0.15));
const labelLayer = L.layerGroup().addTo(map);
const pinLayer = L.layerGroup().addTo(map);
// Labels grow with the zoom like printed map text; sub-areas only appear once there is room for them.
const updateZoomClass = () => {
  const el = document.getElementById("map"), s = 2 ** map.getZoom();
  el.classList.toggle("zoom-far", map.getZoom() < -1.6);
  el.style.setProperty("--fa", Math.max(11, Math.min(40, 40 * s)) + "px");
  el.style.setProperty("--fs", Math.max(10, Math.min(22, 24 * s)) + "px");
};
map.on("zoomend", updateZoomClass); updateZoomClass();

function drawLabels() {
  labelLayer.clearLayers();
  for (const l of HK.labels) {
    L.marker([-l.y, l.x], { interactive: false, keyboard: false,
      icon: L.divIcon({ className: "", html: `<div class="lbl ${l.k}">${esc(en() ? l.en : l.it)}</div>`, iconSize: [0, 0] }) }).addTo(labelLayer);
  }
}

const faceStyle = (i, px) => {
  const k = px / B.cell;
  return `background-image:url(bestiary.webp);background-size:${B.cols * B.cell * k}px auto;background-position:-${(i % B.cols) * B.cell * k}px -${Math.floor(i / B.cols) * B.cell * k}px`;
};
const markerIcon = (g, state, inner) => L.divIcon({ className: "", iconSize: [32, 32], iconAnchor: [3, 31], popupAnchor: [13, -30],
  html: `<div class="mk ${state}" style="--c:${CAT[g][3]}">${inner}</div>` });
const matches = s => !query || s.toLowerCase().includes(query);

function locState(i) {
  const rows = ROWS.map((r, k) => [r, k]).filter(([r]) => r.loc === i);
  const n = got ? rows.filter(([, k]) => got.has(k)).length : 0;
  return { rows, done: got && n === rows.length };
}

function itemPopup(i) {
  const l = HK.locs[i], { rows } = locState(i);
  const head = `<h4>${esc(l.sub ? l.n.replace(/_/g, " ") : pretty(l.n))}</h4><p class="meta">${esc(gname(l.g))}, ${esc(zone(l.a))}</p>`;
  return l.sub ? head + `<ul>${rows.map(([r, k]) => `<li class="${got && got.has(k) ? "got" : ""}">${esc(r.name)}</li>`).join("")}</ul>` : head;
}
function enemyPopup(p) {
  const e = B.entries[p.ei], s = beastState(e);
  return `<h4>${esc(beastName(e))}</h4><p class="meta">${esc(zone(p.a))}, ${t("inRoom", p.n)}</p>
    <p class="st ${s.cls === "done" ? "done" : ""}">${esc(s.text)}</p>
    ${e.w ? `<p><a href="https://hollowknight.wiki/w/${encodeURIComponent(e.w)}" target="_blank" rel="noopener">${t("wiki")}</a></p>` : ""}`;
}

const itemMarkers = HK.locs.map((l, i) => L.marker([-l.y, l.x]).bindPopup(() => itemPopup(i)));
const enemyMarkers = ENEMY_PINS.map(p => L.marker([-p.y, p.x]).bindPopup(() => enemyPopup(p)));
let highlight = null;

function drawMap() {
  pinLayer.clearLayers();
  const showGot = document.getElementById("showGot").checked;
  HK.locs.forEach((l, i) => {
    if (!shown.has(l.g)) return;
    const s = locState(i);
    if (s.done && !showGot && highlight !== "i" + i) return;
    if (!matches(l.n.replace(/_/g, " ") + " " + s.rows.map(([r]) => r.name).join(" "))) return;
    const m = itemMarkers[i];
    m.setIcon(markerIcon(l.g, (s.done ? "got" : "") + (highlight === "i" + i ? " hit" : ""), `<img src="pins/${CAT[l.g][2]}.png" alt="">`));
    m.setZIndexOffset(s.done ? -1000 : 0);
    m.unbindTooltip().bindTooltip(l.sub ? l.n.replace(/_/g, " ") : pretty(l.n), { direction: "top", offset: [13, -30] });
    m.addTo(pinLayer);
  });
  if (shown.has("Journal")) ENEMY_PINS.forEach((p, j) => {
    const e = B.entries[p.ei], s = beastState(e);
    if (s.cls === "done" && !showGot && highlight !== "e" + p.ei) return;
    if (!matches(beastName(e) + " " + e.en)) return;
    const m = enemyMarkers[j];
    m.setIcon(markerIcon("Journal", (s.cls === "done" ? "got" : "") + (highlight === "e" + p.ei ? " hit" : ""), `<span class="face" style="${faceStyle(p.ei, 24)}"></span>`));
    m.unbindTooltip().bindTooltip(beastName(e), { direction: "top", offset: [13, -30] });
    m.addTo(pinLayer);
  });
}

// ---- sidebar
function drawList() {
  const showGot = document.getElementById("showGot").checked;
  let html = "";
  for (const [gkey, cats] of GROUPS) {
    html += `<div class="grp">${t(gkey)}</div>`;
    for (const g of Object.keys(cats)) {
      let rows, n, total, body;
      if (g === "Journal") {
        const ents = B.entries.map((e, i) => [e, i, beastState(e)]);
        total = ents.length; n = pd ? ents.filter(([, , s]) => s.cls === "done").length : 0;
        body = ents.filter(([e, , s]) => (showGot || s.cls !== "done") && matches(beastName(e) + " " + e.en))
          .map(([e, i, s]) => `<li class="${s.cls === "done" ? "got" : ""}"><button type="button" data-e="${i}">${esc(beastName(e))}</button> <small>${esc(s.text)}</small></li>`).join("");
      } else {
        rows = ROWS.map((r, k) => [r, k]).filter(([r]) => r.g === g);
        total = rows.length; n = got ? rows.filter(([, k]) => got.has(k)).length : 0;
        const list = rows.filter(([r, k]) => (showGot || !got || !got.has(k)) && matches(r.name + " " + (r.place || "")));
        const areas = {};
        for (const [r, k] of list) (areas[r.a] ??= []).push([r, k]);
        body = Object.entries(areas).map(([a, rs]) => `<div class="area">${esc(zone(a))}</div>${rs.map(([r, k]) =>
          `<li class="${got && got.has(k) ? "got" : ""}"><button type="button" data-loc="${r.loc}">${esc(r.name)}</button>${r.place ? ` <small>${esc(t("inShop", r.place))}</small>` : ""}</li>`).join("")}`).join("");
      }
      const ico = cats[g][2] ? `<img src="pins/${cats[g][2]}.png" alt="">` : `<span style="width:20px;height:20px;border-radius:50%;${faceStyle(0, 20)}"></span>`;
      html += `<details class="cat${shown.has(g) ? "" : " off"}${got && n === total ? " done" : ""}" data-g="${g}"${open.has(g) || query ? " open" : ""}>
        <summary><button type="button" class="ico" data-toggle="${g}" style="--c:${cats[g][3]}" aria-pressed="${shown.has(g)}" aria-label="${esc(gname(g))}">${ico}</button>
        <span class="nm">${esc(gname(g))}</span><span class="n">${got ? `${n}/` : ""}${total}</span></summary><ul>${body}</ul></details>`;
    }
  }
  document.getElementById("cats").innerHTML = html;
  const n = got ? got.size : 0;
  document.getElementById("total").textContent = got ? t("found", n, ROWS.length) : t("total", ROWS.length);
  document.getElementById("pfill").style.width = got ? `${100 * n / ROWS.length}%` : "0";
}

function showTab(name) {

  if (name === "map") map.invalidateSize();
}
function focusEnemy(ei) {

    e.preventDefault();
    const g = tog.dataset.toggle;
    shown.has(g) ? shown.delete(g) : shown.add(g);
    drawMap(); drawList();
    return;
  }
  const btn = e.target.closest("button[data-loc]");
  if (btn) {
    const i = +btn.dataset.loc, l = HK.locs[i];
    shown.add(l.g); highlight = "i" + i; render();
    map.flyTo([-l.y, l.x], 0, { duration: .6 });
    setTimeout(() => itemMarkers[i].openPopup(), 650);
    return;
  }
  const eb = e.target.closest("button[data-e]");
  if (eb) focusEnemy(+eb.dataset.e);
});
document.getElementById("beasts").addEventListener("click", e => {
  const b = e.target.closest("button[data-e]");
  if (b) focusEnemy(+b.dataset.e);
});
document.getElementById("cats").addEventListener("toggle", e => {
  const g = e.target.dataset.g;
  if (g && !query) e.target.open ? open.add(g) : open.delete(g);
}, true);
document.getElementById("showGot").onchange = render;
document.getElementById("showAll").onclick = () => { Object.keys(CAT).forEach(g => shown.add(g)); drawMap(); drawList(); };
document.getElementById("hideAll").onclick = () => { shown.clear(); drawMap(); drawList(); };
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); drawMap(); drawList(); });
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
document.querySelectorAll(".filters").forEach(g => g.addEventListener("click", e => {
  const b = e.target.closest("[data-f]");
  if (!b) return;
  g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  if (g.id === "afilters") { afilter = b.dataset.f; drawAch(); } else { filter = b.dataset.f; drawJournal(); }
}));

async function load(file) {
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const save = parseSave(await file.arrayBuffer());
    const has = checker(save);
    pd = save.playerData;
    got = new Set(ROWS.map((r, k) => has(r.tr) ? k : -1).filter(k => k >= 0));
    render();
  } catch (e) {
    err.textContent = e instanceof SyntaxError || e instanceof TypeError ? t("notSave") : e.message;
  }
}
document.getElementById("file").onchange = e => e.target.files[0] && load(e.target.files[0]);
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); });
document.getElementById("cp").onclick = e => {
  navigator.clipboard?.writeText(document.getElementById("p").textContent);
  e.target.textContent = t("copied");
};
I18N.init(STRINGS, () => {
  document.getElementById("err").textContent = "";
  document.getElementById("q").placeholder = t("search");
  drawLabels(); render();
});
</script>
</body>
</html>
